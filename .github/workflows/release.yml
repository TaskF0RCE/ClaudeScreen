# "Nouvelle release" button of the dashboard -> release PR (version + CHANGELOG).
# Merging that PR into main -> tag + GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: TaskF0RCE/.github/.github/workflows/release.yml@main
