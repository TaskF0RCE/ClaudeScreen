# "Nouvelle release" button of the dashboard -> release PR (version + CHANGELOG).
# Merging that PR into main -> tag + GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: TaskF0RCE/.github/.github/workflows/release.yml@main

  # ClaudeScreen-Setup.exe, attached to the release that this push just published.
  # Nothing to do when this commit is not the one of a release, or when the file is already there.
  setup:
    name: Setup.exe on the release
    needs: release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and attach
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\installer\Publish-Setup.ps1 | Tee-Object -Variable message
          "$message" >> $env:GITHUB_STEP_SUMMARY
